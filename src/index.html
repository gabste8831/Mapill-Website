      rel="stylesheet"
    />

    <!--
      Roda antes da primeira pintura:
      - classe .js: os blocos .reveal começam ocultos e entram ao rolar (sem JS, tudo aparece);
      - data-theme: tema salvo pela pessoa ou, sem escolha, o do sistema. Evita piscar no tema errado.
      Manter a chave e as cores em sincronia com src/app/core/theme.service.ts.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var saved = null;
        root.classList.add('js');
        try {
          saved = localStorage.getItem('mapill-tema');
        } catch (e) {}
        var theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        root.setAttribute('data-theme', theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0F1319' : '#F1F4F8');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
