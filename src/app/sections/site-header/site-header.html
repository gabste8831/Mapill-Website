<header class="site-nav" [class.is-scrolled]="scrolled()">
  <nav class="nav container" aria-label="Navegação principal">
    <app-logo />

    <div class="nav-links">
      <a routerLink="/" fragment="como-funciona">Como funciona</a>
      <a routerLink="/" fragment="recursos">Recursos</a>
      <a routerLink="/" fragment="acessibilidade">Acessibilidade</a>
      <a routerLink="/" fragment="videos">Vídeos</a>
      <a routerLink="/" fragment="perguntas">Perguntas</a>
      <a routerLink="/documentacao" routerLinkActive="is-active">Documentação</a>
    </div>

    <div class="nav-actions">
      <app-theme-toggle />
      <a class="btn btn-primary nav-cta" [href]="site.apkUrl" download>Baixar APK</a>
    </div>
  </nav>

  <!-- Barra de progresso da leitura: só visual, a posição na página não depende dela -->
  <div class="scroll-progress" aria-hidden="true">
    <span #progressBar></span>
  </div>
</header>
