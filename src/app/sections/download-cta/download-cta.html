<section id="baixar" class="section-space">
  <div class="container">
    <div class="final-cta" appReveal>
      <div class="final-cta-copy">
        <p class="eyebrow">Mapill para Android</p>
        <h2>Deixe a lembrança com o Mapill. Fique com a tranquilidade.</h2>
        <a class="btn btn-lg btn-white" [href]="site.apkUrl" download>
          <svg appIcon="download"></svg>
          Baixar APK para Android
        </a>
        <p class="cta-note">
          Instalação direta pelo arquivo APK. Ainda não disponível para iPhone.
        </p>
      </div>

      <app-phone-frame class="cta-phone" label="Tela de alarme do Mapill">
        <app-alarm-screen />
      </app-phone-frame>
    </div>
  </div>
</section>
